services:
  telegram-leecher:
    build: .
    container_name: telegram-media-leecher
    restart: unless-stopped
    env_file:
      - .env
    # Needed for initial interactive Telegram authentication
    stdin_open: true
    tty: true
    volumes:
      # Persistent Telegram session file
      - ./data:/app/data
      # Mount host media storage directories
      - /mnt/storage/films:/media/films
      - /mnt/storage/series:/media/series
      - /mnt/storage/animes:/media/animes
      - /mnt/storage/adulte:/media/adulte
    environment:
      - PYTHONUNBUFFERED=1
